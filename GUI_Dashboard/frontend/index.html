<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 لوحة تحكم المزرعة الذكية</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grafana-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .grafana-btn:hover {
            transform: translateY(-2px);
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-card h3 {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .kpi-card p {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-green);
        }

        /* Sensors Grid */
        .sensors-section {
            margin-bottom: 30px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            padding: 15px;
            background: var(--bg-card);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.green {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .dot.yellow {
            background: var(--accent-yellow);
            box-shadow: 0 0 8px var(--accent-yellow);
        }

        .dot.red {
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        .sensors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .sensor-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border-right: 4px solid var(--accent-green);
            transition: all 0.3s ease;
        }

        .sensor-card.warning {
            border-right-color: var(--accent-yellow);
        }

        .sensor-card.danger {
            border-right-color: var(--accent-red);
        }

        .sensor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .sensor-name {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .sensor-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .sensor-label {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* Main Content (Chart & Map) */
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            height: 450px;
        }

        #map {
            height: 380px;
            width: 100%;
            border-radius: 10px;
        }

        canvas {
            max-height: 380px;
        }

        /* Chatbot */
        .chatbot-toggler {
            position: fixed;
            bottom: 30px;
            left: 30px;
            height: 60px;
            width: 60px;
            background: var(--accent-green);
            border-radius: 50%;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            z-index: 1000;
            transition: transform 0.3s;
        }

        .chatbot-toggler:hover {
            transform: scale(1.1);
        }

        .chatbot {
            position: fixed;
            left: 30px;
            bottom: 100px;
            width: 350px;
            background: var(--bg-card);
            border-radius: 15px;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
            transform-origin: bottom left;
            transition: all 0.3s ease;
            z-index: 999;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.show-chatbot .chatbot {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .chatbot header {
            background: var(--accent-green);
            padding: 15px;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }

        .chatbox {
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            list-style: none;
        }

        .chat {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .chat.outgoing {
            justify-content: flex-end;
        }

        .chat p {
            background: #334155;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 0.9rem;
        }

        .chat.outgoing p {
            background: var(--accent-green);
        }

        .chat-input {
            padding: 15px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        .chat-input textarea {
            width: 100%;
            background: #0f172a;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            resize: none;
            height: 50px;
            font-family: 'Cairo', sans-serif;
        }

        .chat-input span {
            color: var(--accent-green);
            cursor: pointer;
            align-self: flex-end;
            font-size: 1.2rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-content {
            background: var(--bg-card);
            margin: 2% auto;
            padding: 20px;
            width: 95%;
            height: 90%;
            border-radius: 15px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            left: 20px;
            top: 10px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .card {
                height: auto;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🌱 لوحة تحكم المزرعة الذكية</h1>
        <button onclick="openGrafana()" class="grafana-btn">
            <i class="fa-solid fa-chart-line"></i> فتح Grafana
        </button>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card">
            <h3>إجمالي الإنتاج</h3>
            <p id="total-yield">1,250.5 كجم</p>
        </div>
        <div class="kpi-card">
            <h3>متوسط الرطوبة</h3>
            <p id="avg-moisture">45.2%</p>
        </div>
        <div class="kpi-card">
            <h3>الحساسات النشطة</h3>
            <p id="active-sensors">8</p>
        </div>
    </div>

    <div class="sensors-section">
        <h2 style="margin-bottom: 15px; color: var(--accent-green);">📊 حالة الحساسات</h2>

        <div class="legend">
            <div class="legend-item">
                <div class="dot green"></div> <span>صحة جيدة</span>
            </div>
            <div class="legend-item">
                <div class="dot yellow"></div> <span>تحذير</span>
            </div>
            <div class="legend-item">
                <div class="dot red"></div> <span>خطر - إجراء فوري</span>
            </div>
        </div>

        <div class="sensors-grid" id="sensors-grid">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <h2 style="color: var(--accent-green); margin-bottom: 15px;">📈 درجة الحرارة المباشرة</h2>
            <canvas id="tempChart"></canvas>
        </div>
        <div class="card">
            <h2 style="color: var(--accent-green); margin-bottom: 15px;">🗺️ موقع المزرعة</h2>
            <div id="map"></div>
        </div>
    </div>

    <!-- Chatbot -->
    <button class="chatbot-toggler">
        <i class="fa-solid fa-message"></i>
    </button>
    <div class="chatbot">
        <header>
            <h2 style="color: white; font-size: 1.2rem;">🤖 المساعد الذكي</h2>
        </header>
        <ul class="chatbox">
            <li class="chat incoming">
                <i class="fa-solid fa-robot" style="color: white; margin-top: 10px;"></i>
                <p>مرحباً! كيف يمكنني مساعدتك في المزرعة اليوم؟ 🌱</p>
            </li>
        </ul>
        <div class="chat-input">
            <textarea placeholder="اكتب سؤالك هنا..." required></textarea>
            <span id="send-btn"><i class="fa-solid fa-paper-plane"></i></span>
        </div>
    </div>

    <!-- Grafana Modal -->
    <div id="grafanaModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeGrafana()">&times;</span>
            <iframe id="grafanaFrame" src=""></iframe>
        </div>
    </div>

    <script>
        // --- Data & Logic ---
        let currentSensorData = {
            soil_temperature: 25, air_temperature: 28,
            soil_humidity: 60, air_humidity: 65,
            soil_ph: 6.5, soil_salinity: 2.0,
            light_intensity: 50000, water_level: 75
        };

        // 1. Initialize Map
        const map = L.map('map').setView([30.05, 31.25], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        L.marker([30.05, 31.25]).addTo(map).bindPopup('🌱 الصوبة الرئيسية').openPopup();

        // 2. Initialize Chart
        const ctx = document.getElementById('tempChart').getContext('2d');
        const tempChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'درجة الحرارة (°C)',
                    data: [],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#334155' } },
                    y: { grid: { color: '#334155' } }
                }
            }
        });

        // 3. Update Sensors
        function updateSensorsDisplay() {
            const sensorsGrid = document.getElementById('sensors-grid');
            const sensors = [
                { name: 'حرارة التربة', value: currentSensorData.soil_temperature, unit: '°C', min: 15, max: 35 },
                { name: 'حرارة الهواء', value: currentSensorData.air_temperature, unit: '°C', min: 18, max: 38 },
                { name: 'رطوبة التربة', value: currentSensorData.soil_humidity, unit: '%', min: 40, max: 80 },
                { name: 'رطوبة الهواء', value: currentSensorData.air_humidity, unit: '%', min: 50, max: 85 },
                { name: 'الأس الهيدروجيني', value: currentSensorData.soil_ph, unit: 'pH', min: 6.0, max: 7.5 },
                { name: 'الملوحة', value: currentSensorData.soil_salinity, unit: 'dS/m', min: 1.0, max: 3.0 },
                { name: 'الإضاءة', value: (currentSensorData.light_intensity / 1000).toFixed(1), unit: 'K lux', min: 20, max: 100 },
                { name: 'مستوى الماء', value: currentSensorData.water_level, unit: '%', min: 30, max: 100 }
            ];

            sensorsGrid.innerHTML = sensors.map(s => {
                let status = 'green';
                let cls = '';
                if (s.value < s.min || s.value > s.max) { status = 'red'; cls = 'danger'; }
                else if (s.value < s.min * 1.1 || s.value > s.max * 0.9) { status = 'yellow'; cls = 'warning'; }

                return `
                    <div class="sensor-card ${cls}">
                        <div class="sensor-header">
                            <span class="sensor-name">${s.name}</span>
                            <div class="dot ${status}"></div>
                        </div>
                        <div class="sensor-value">${s.value} <small>${s.unit}</small></div>
                        <div class="sensor-label">المثالي: ${s.min}-${s.max}</div>
                    </div>
                `;
            }).join('');
        }
        updateSensorsDisplay();

        // 4. WebSocket
        const ws = new WebSocket(`ws://${window.location.hostname}:8000/ws/live`);
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.soil_temperature_c) currentSensorData.soil_temperature = data.soil_temperature_c;
                if (data.air_temperature_c) currentSensorData.air_temperature = data.air_temperature_c;
                if (data.soil_humidity_percent) currentSensorData.soil_humidity = data.soil_humidity_percent;
                if (data.air_humidity_percent) currentSensorData.air_humidity = data.air_humidity_percent;
                if (data.soil_ph) currentSensorData.soil_ph = data.soil_ph;
                if (data.soil_salinity_ds_m) currentSensorData.soil_salinity = data.soil_salinity_ds_m;
                if (data.light_intensity_lux) currentSensorData.light_intensity = data.light_intensity_lux;
                if (data.water_level_percent) currentSensorData.water_level = data.water_level_percent;

                updateSensorsDisplay();
                document.getElementById('avg-moisture').innerText = currentSensorData.soil_humidity.toFixed(1) + '%';

                // Update Chart
                const time = new Date().toLocaleTimeString('ar-EG');
                if (tempChart.data.labels.length > 20) {
                    tempChart.data.labels.shift();
                    tempChart.data.datasets[0].data.shift();
                }
                tempChart.data.labels.push(time);
                tempChart.data.datasets[0].data.push(currentSensorData.air_temperature);
                tempChart.update();

            } catch (e) { console.error(e); }
        };

        // 5. Chatbot Logic
        const chatInput = document.querySelector(".chat-input textarea");
        const chatbox = document.querySelector(".chatbox");
        const chatbotToggler = document.querySelector(".chatbot-toggler");

        chatbotToggler.addEventListener("click", () => document.body.classList.toggle("show-chatbot"));

        const handleChat = () => {
            const msg = chatInput.value.trim();
            if (!msg) return;
            chatInput.value = "";

            // User Msg
            const userLi = document.createElement("li");
            userLi.classList.add("chat", "outgoing");
            userLi.innerHTML = `<p>${msg}</p>`;
            chatbox.appendChild(userLi);

            // Bot Response
            setTimeout(() => {
                const botLi = document.createElement("li");
                botLi.classList.add("chat", "incoming");
                let reply = "أنا لسه بتعلم... اسألني عن الحرارة أو الرطوبة! 🌱";

                // منطق الرد الذكي
                if (msg.includes("مرحبا") || msg.includes("السلام") || msg.includes("هلا")) {
                    const greetings = [
                        "مرحباً بك! أنا هنا لمساعدتك في مراقبة مزرعتك 🌾",
                        "أهلاً وسهلاً! كيف يمكنني خدمتك اليوم؟ 🌱",
                        "السلام عليكم! جاهز للإجابة على أسئلتك 🚜"
                    ];
                    reply = greetings[Math.floor(Math.random() * greetings.length)];
                }
                else if (msg.includes("رطوبة") || msg.includes("ري") || msg.includes("ماء")) {
                    const moisture = currentSensorData.soil_humidity;
                    if (moisture < 40) reply = `⚠️ تحذير! رطوبة التربة منخفضة جداً (${moisture.toFixed(1)}%). يجب تشغيل نظام الري فوراً! 💧`;
                    else if (moisture < 50) reply = `⚡ رطوبة التربة (${moisture.toFixed(1)}%) تحتاج إلى ري قريباً. راقب الوضع. 💦`;
                    else if (moisture > 80) reply = `⚠️ رطوبة التربة مرتفعة جداً (${moisture.toFixed(1)}%)! قد يسبب هذا تعفن الجذور. أوقف الري. 🚫`;
                    else reply = `✅ رطوبة التربة ممتازة (${moisture.toFixed(1)}%). لا حاجة للري الآن. 👍`;
                }
                else if (msg.includes("حرارة") || msg.includes("درجة")) {
                    const airTemp = currentSensorData.air_temperature;
                    if (airTemp > 38) reply = `🔥 تحذير! درجة حرارة الهواء مرتفعة جداً (${airTemp.toFixed(1)}°C). افتح فتحات التهوية!`;
                    else if (airTemp < 15) reply = `❄️ تحذير! درجة الحرارة منخفضة (${airTemp.toFixed(1)}°C). قد تحتاج لتدفئة الصوبة.`;
                    else reply = `✅ درجات الحرارة مثالية! الهواء: ${airTemp.toFixed(1)}°C 🌡️`;
                }
                else if (msg.includes("تربة") || msg.includes("ph") || msg.includes("حموضة")) {
                    const ph = currentSensorData.soil_ph;
                    const salinity = currentSensorData.soil_salinity;
                    reply = `📊 تحليل التربة:\nPH: ${ph.toFixed(1)}\nالملوحة: ${salinity.toFixed(1)}\nحافظ على التسميد العضوي! 🍂`;
                }
                else if (msg.includes("حالة") || msg.includes("وضع") || msg.includes("كيف")) {
                    reply = "✅ الحمد لله! جميع الأنظمة تعمل بشكل ممتاز. المزرعة في حالة رائعة! 🎉";
                }
                else {
                    reply = "عذراً، لم أفهم سؤالك. جرب السؤال عن: الرطوبة، الحرارة، التربة، الري، أو الحالة العامة. 🤔";
                }

                botLi.innerHTML = `<i class="fa-solid fa-robot" style="color: white; margin-top: 10px;"></i><p>${reply}</p>`;
                chatbox.appendChild(botLi);
                chatbox.scrollTo(0, chatbox.scrollHeight);
            }, 600);
        }

        document.getElementById("send-btn").addEventListener("click", handleChat);
        chatInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleChat(); }
        });

        // 6. Grafana Modal
        function openGrafana() {
            document.getElementById("grafanaModal").style.display = "block";
            document.getElementById("grafanaFrame").src = "http://" + window.location.hostname + ":3001";
        }
        function closeGrafana() {
            document.getElementById("grafanaModal").style.display = "none";
            document.getElementById("grafanaFrame").src = "";
        }
    </script>
</body>

</html>
